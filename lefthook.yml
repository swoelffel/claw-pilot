pre-commit:
  parallel: true
  commands:
    format-check:
      glob: "*.ts"
      run: pnpm format:check
    lint:
      glob: "src/**/*.ts"
      run: pnpm lint:all
    typecheck:
      run: pnpm typecheck:all
    complexity:
      glob: "src/**/*.ts"
      run: pnpm lint:complexity
    discipline-r1-r5:
      glob: "src/**/*.ts"
      run: pnpm lint:discipline:fast

pre-push:
  commands:
    test:
      run: pnpm test:run
    discipline-full:
      run: pnpm lint:discipline:full
    spellcheck:
      run: pnpm spellcheck
    circular:
      run: pnpm check:circular
    knip:
      run: pnpm knip --reporter compact
    build:
      run: pnpm build
    no-silent-catches:
      run: node tools/no-silent-catches.cjs

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}
