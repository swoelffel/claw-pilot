name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Shared setup anchor (YAML merge key) ─────────────────────────────────────
# GitHub Actions doesn't support YAML anchors, so we use a reusable setup
# pattern: each job repeats checkout + pnpm + node + install.

jobs:
  # ── Job 1: Quality checks (fast feedback ~1 min) ──────────────────────────
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true # npm retired legacy audit endpoints (410), awaiting pnpm fix
      - name: Security audit (production only)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true # npm retired legacy audit endpoints (410), awaiting pnpm fix
      - name: Format check
        run: pnpm format:check
      - name: Typecheck (CLI + UI)
        run: pnpm typecheck:all
      - name: Lint (CLI + UI)
        run: pnpm lint:all
      - name: Spell check
        run: pnpm spellcheck
      - name: Complexity check (cognitive complexity + function length)
        run: pnpm lint:complexity

  # ── Job 2: Unit tests + coverage (parallel with quality) ───────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Test with coverage
        run: pnpm test:run --coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 3: Static analysis (parallel with quality + test) ──────────────────
  analysis:
    name: Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Dead code check
        run: pnpm knip --reporter compact
      - name: Circular dependency check
        run: pnpm check:circular

  # ── Job 4: E2E tests (parallel, non-blocking) ─────────────────────────────
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: E2E tests
        run: pnpm test:e2e

  # ── Job 5: Build (depends on quality + test passing) ───────────────────────
  build:
    name: Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Build (CLI + UI)
        run: pnpm build

  # ── Job 6: Discipline gates (R1/R2/R3/R5 — Community↔Enterprise firewall) ─
  discipline-gates:
    name: Discipline Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # R2/R3 need git history vs base branch
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Discipline gates (R1 + R2 + R3 + R5)
        run: pnpm lint:discipline:ci
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
