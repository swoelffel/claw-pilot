name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v6.0.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.21"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          if [ "$pkg_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v v="## [${version}]" '
            index($0, v) == 1 {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No notes found in CHANGELOG.md for version ${version}" >&2
            exit 1
          fi

      - name: Generate SBOM (CycloneDX)
        run: pnpm dlx @cyclonedx/cdxgen@latest -o sbom.cdx.json -t pnpm .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Only claim "Latest" when this tag is the highest semver in the repo.
          # A retroactive or backport tag must not demote the newest release,
          # which is what the GitHub UI and the releases/latest API expose.
          highest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ "${TAG}" = "${highest}" ]; then
            latest_flag="--latest=true"
          else
            latest_flag="--latest=false"
            echo "::notice::${TAG} is not the highest tag (${highest}) — publishing without the Latest marker."
          fi

          gh release create "${TAG}" \
            --title "claw-pilot ${TAG}" \
            --notes-file RELEASE_NOTES.md \
            "${latest_flag}" \
            sbom.cdx.json
